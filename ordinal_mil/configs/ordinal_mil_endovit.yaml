# Backbone ablation companion to D (ordinal_mil.yaml): identical model/loss
# config, EndoViT backbone instead of DINOv2.
experiment_name: D_ordinal_mil_endovit

backbone:
  name: endovit

model:
  head_type: ordinal
  ordinal_head_type: coral
  use_mil: true
  pooling: gated_attention
  mil_attn_dim: 128

loss:
  use_ranking: false
  lambda_ordinal: 1.0
  lambda_reg: 0.15
